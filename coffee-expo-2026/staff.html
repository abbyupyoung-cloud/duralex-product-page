<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>借杯攤位後台</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  /* 品牌色：主色 #1f286f、強調 #ed6d0f、次色 #ffffff、搭配 #c1bebc */
  :root { --navy: #1F286F; --orange: #ED6D0F; --green: #1E8E5A; --red: #C0392B; --bg: #F3F2F1; --line: #C1BEBC; --muted: #6E6A68; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: #222; font: 15px/1.5 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--navy); color: #fff; padding: 10px 12px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; font-size: 12px; text-align: center; }
  .stats b { display: block; font-size: 18px; }
  .search { display: flex; gap: 6px; margin-top: 10px; }
  .search input[type=search] { flex: 1; padding: 10px; font-size: 16px; border: 0; border-radius: 8px; }
  .search button { padding: 0 14px; border: 0; border-radius: 8px; background: var(--orange); color: #fff; font-weight: 700; }
  .all { font-size: 13px; margin-top: 6px; display: flex; align-items: center; gap: 6px; }
  main { padding: 12px; max-width: 640px; margin: 0 auto; }
  .card { background: #fff; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .top { display: flex; justify-content: space-between; align-items: baseline; }
  .no { font-size: 24px; font-weight: 800; color: var(--navy); }
  .pill { padding: 2px 10px; border-radius: 99px; font-size: 13px; background: #EEE; }
  .pill.out { background: #FFE9D6; color: #A34E0A; }
  .pill.reg { background: #E6E8F2; color: var(--navy); }
  .meta { color: var(--muted); font-size: 13px; }
  .who { font-size: 17px; font-weight: 600; margin: 2px 0; }
  .btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
  .btns button { padding: 12px 4px; font-size: 15px; font-weight: 700; border: 0; border-radius: 8px; color: #fff; }
  .btns .wide { grid-column: 1 / -1; }
  .lend { background: var(--orange); }
  .ret { background: var(--green); }
  .dmg { background: var(--red); }
  .buy { background: var(--navy); }
  .sub { background: #fff !important; color: var(--navy) !important; border: 1px solid var(--line) !important; font-weight: 400 !important; }
  button:disabled { opacity: .45; }
  #toast { position: fixed; left: 12px; right: 12px; bottom: 16px; padding: 12px; border-radius: 10px; background: #222; color: #fff; text-align: center; display: none; z-index: 3; }
  #toast.warn { background: var(--red); }
  .center { text-align: center; color: var(--muted); padding: 30px 0; }
  .search .refresh { background: rgba(255,255,255,.18); padding: 0 12px; font-size: 18px; }
  .search .refresh.spin { opacity: .5; }
  #statsLink { display: block; margin: 28px auto 72px; border: 0; background: none; color: #B5B2B0; font-size: 12px;
    text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  #dailyMask { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-end; justify-content: center; z-index: 4; }
  #dailyMask.show { display: flex; }
  #dailyPanel { background: #fff; width: 100%; max-width: 640px; max-height: 80vh; overflow: auto; border-radius: 16px 16px 0 0; padding: 16px 12px 24px; }
  #dailyPanel h3 { margin: 0 0 10px; font-size: 16px; color: var(--navy); display: flex; justify-content: space-between; align-items: center; }
  #dailyPanel h3 button { border: 0; background: none; font-size: 22px; color: var(--muted); }
  #dailyTable { width: 100%; border-collapse: collapse; font-size: 13px; }
  #dailyTable th, #dailyTable td { padding: 8px 4px; text-align: right; border-bottom: 1px solid #EEE; white-space: nowrap; }
  #dailyTable th:first-child, #dailyTable td:first-child { text-align: left; }
  #dailyTable th { color: var(--muted); font-weight: 400; font-size: 12px; }
  #dailyTable tr.total td { font-weight: 700; color: var(--navy); border-top: 2px solid var(--navy); border-bottom: 0; }
  .dailyNote { font-size: 11px; color: var(--muted); margin-top: 10px; line-height: 1.6; }
  code { user-select: all; background: #EEE; padding: 2px 6px; border-radius: 4px; word-break: break-all; }
</style>
</head>
<body>
<header id="head" style="display:none">
  <div class="stats">
    <div><b id="sLent">–</b>已借出</div>
    <div><b id="sRet">–</b>已還</div>
    <div><b id="sReg">–</b>待領杯</div>
  </div>
  <form class="search" id="searchForm">
    <input type="search" id="q" placeholder="編號（可只打數字）/ 手機末碼 / 姓名">
    <button>搜尋</button>
    <button type="button" class="refresh" id="refresh" aria-label="重新整理">↻</button>
  </form>
  <label class="all"><input type="checkbox" id="all"> 包含其他日期</label>
</header>
<main id="list"><div class="center">載入中…</div></main>
<button id="statsLink" type="button" style="display:none">每日統計</button>
<div id="dailyMask">
  <div id="dailyPanel">
    <h3>每日借還杯統計 <button type="button" id="dailyClose" aria-label="關閉">×</button></h3>
    <div id="dailyBody">載入中…</div>
  </div>
</div>
<div id="toast"></div>

<script>
const LIFF_ID = '2012334609-09pGZWSN';
const API_URL = 'https://script.google.com/macros/s/AKfycbw6LdRl7bfeHCsBS2TwJ3oY7fZ2uNTT4s6QGn6m4FZQGnnD5Zc89ednMq2fpBp3UAC_5g/exec';
const DEPOSIT = 100;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2));

async function api(action, body = {}) {
  const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, accessToken: liff.getAccessToken(), ...body }) });
  const j = await res.json();
  if (!j.ok) {
    if (j.code === 'AUTH') { liff.logout(); liff.login({ redirectUri: location.href }); }
    throw new Error(j.message);
  }
  return j.data;
}

let toastTimer;
function toast(msg, warn) {
  const t = $('toast');
  t.textContent = msg;
  t.className = warn ? 'warn' : '';
  t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.style.display = 'none'), warn ? 6000 : 2500);
}

async function loadStats() {
  try {
    const s = await api('stats');
    $('sLent').textContent = s.lent; $('sRet').textContent = s.returned; $('sReg').textContent = s.registered;
  } catch (x) { /* 統計失敗不影響操作 */ }
}

function cardHtml(r) {
  const pill = r.status === '借出中' ? 'out' : r.status === '已登記' ? 'reg' : '';
  const counts = [r.returned && `已還 ${r.returned}`, r.onsite && `現場購買 ${r.onsite}`, r.damaged && `破損 ${r.damaged}`, r.overdue && `逾時 ${r.overdue}`].filter(Boolean).join('・');
  let btns = '';
  if (r.status === '已登記') {
    btns = `<button class="lend wide" data-act="lend">已收押金 $${r.cups * DEPOSIT}・借出 ${r.cups} 杯</button>`;
  } else if (r.status === '借出中') {
    btns = `<button class="ret" data-act="returned">還 1 杯</button><button class="buy" data-act="onsite">現場購買 1 杯</button><button class="dmg" data-act="damaged">破損 1 杯</button>`;
  }
  if (r.status === '已登記' || r.status === '借出中') btns += `<button class="sub wide" data-act="resend">補發借杯證</button>`;
  return `
    <div class="top"><span class="no">${esc(r.id)}</span><span class="pill ${pill}">${esc(r.status)}${r.status === '借出中' ? ` ${r.outstanding}/${r.cups}` : ''}</span></div>
    <div class="who">${esc(r.name)} <span class="meta">手機末 ${esc(r.phoneTail)}</span></div>
    <div class="meta">借 ${r.cups} 杯・${esc(r.dateLabel || r.date)}${r.lentAt ? '・借出 ' + esc(r.lentAt.slice(11, 16)) : ''}${counts ? '・' + counts : ''}</div>
    ${btns ? `<div class="btns">${btns}</div>` : ''}`;
}

const records = new Map();

function render(list) {
  const main = $('list');
  records.clear();
  list.forEach((r) => records.set(r.id, r));
  if (!list.length) { main.innerHTML = '<div class="center">沒有符合的登記</div>'; return; }
  main.innerHTML = '';
  list.forEach((r) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.id = r.id;
    el.innerHTML = cardHtml(r);
    main.appendChild(el);
  });
}

async function search() {
  try {
    render(await api('search', { text: $('q').value, all: $('all').checked }));
  } catch (x) { toast(x.message, true); }
}

const CONFIRM = {
  lend: (r) => `確認已收 ${r.name} 押金 $${r.cups * DEPOSIT}，借出 ${r.cups} 杯？`,
  returned: (r) => `${r.name} 歸還 1 杯（完整無損），退押金 $${DEPOSIT}？`,
  onsite: (r) => `${r.name} 現場購買 1 杯？\n押金 $${DEPOSIT} 轉為貨款，不退。請告知客人：電子發票 11/30 前寄到載具或 Email。`,
  damaged: (r) => `${r.name} 歸還的 1 杯破損？\n押金不退，將列入財務開票名單。`,
  resend: (r) => `補發借杯證給 ${r.name}？`,
};
const DONE = { lend: '已借出', returned: '已還杯，請退押金', onsite: '已記錄現場購買', damaged: '已記錄破損', resend: '已補發借杯證' };

$('list').addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const card = btn.closest('.card');
  const act = btn.dataset.act;
  const rec = records.get(card.dataset.id);
  if (!confirm(CONFIRM[act](rec))) return;
  card.querySelectorAll('button').forEach((b) => (b.disabled = true));
  try {
    let data;
    if (act === 'resend') data = await api('resend', { id: rec.id });
    else if (act === 'lend') data = await api('lend', { id: rec.id, reqId: uuid() });
    else data = await api('settle', { id: rec.id, kind: act, reqId: uuid() });
    if (data.record) { records.set(rec.id, data.record); card.innerHTML = cardHtml(data.record); }
    if (data.pushFailed) toast(`${DONE[act]}，但 LINE 通知傳送失敗（客人可能封鎖官方帳號），請口頭告知`, true);
    else toast(data.already ? '這筆已經借出過了' : DONE[act]);
    loadStats();
  } catch (x) {
    toast(x.message, true);
    card.querySelectorAll('button').forEach((b) => (b.disabled = false));
  }
});

$('searchForm').addEventListener('submit', (e) => { e.preventDefault(); search(); });

// 重新整理：重抓統計與清單（保留目前的搜尋字與日期勾選）
$('refresh').addEventListener('click', async () => {
  const b = $('refresh');
  if (b.classList.contains('spin')) return;
  b.classList.add('spin');
  await Promise.all([loadStats(), search()]);
  b.classList.remove('spin');
  toast('已更新');
});

// 每日統計（頁面最底部的淡灰色小字）
const dRow = (d, cls) => `<tr class="${cls || ''}"><td>${esc(d.label)}</td><td>${d.lent}</td><td>${d.returned}</td>` +
  `<td>${d.bought}</td><td>${d.outNow}</td><td>$${d.cashDeposit.toLocaleString()}</td></tr>`;
$('statsLink').addEventListener('click', async () => {
  $('dailyMask').classList.add('show');
  $('dailyBody').textContent = '載入中…';
  try {
    const { days, total } = await api('daily');
    if (!days.length) { $('dailyBody').textContent = '還沒有資料'; return; }
    $('dailyBody').innerHTML = '<table id="dailyTable"><tr><th>日期</th><th>借出</th><th>已還</th><th>已購買</th><th>借出中</th><th>押金留存</th></tr>' +
      days.map((d) => dRow(d)).join('') + (days.length > 1 ? dRow(total, 'total') : '') + '</table>' +
      '<div class="dailyNote">已購買明細：' + days.map((d) => `${esc(d.label)} 現場 ${d.onsite}／破損 ${d.damaged}／逾時 ${d.overdue}`).join('；') +
      '<br>押金留存＝（借出 − 已還）× $' + DEPOSIT + '，購買的押金直接轉貨款。</div>';
  } catch (x) { $('dailyBody').textContent = '讀取失敗：' + x.message; }
});
$('dailyClose').addEventListener('click', () => $('dailyMask').classList.remove('show'));
$('dailyMask').addEventListener('click', (e) => { if (e.target === $('dailyMask')) $('dailyMask').classList.remove('show'); });
$('all').addEventListener('change', search);

(async () => {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) return liff.login({ redirectUri: location.href });
    const me = await api('whoami');
    if (!me.isStaff) {
      $('list').innerHTML = `<div class="card">此帳號尚未開通工作人員權限。<br>請把下面的 ID 傳給管理員，加入指令碼屬性 STAFF_IDS：<p><code>${esc(me.userId)}</code></p>（${esc(me.displayName)}）</div>`;
      return;
    }
    $('head').style.display = 'block';
    $('statsLink').style.display = 'block';
    await Promise.all([loadStats(), search()]);
    setInterval(loadStats, 60000);
  } catch (x) {
    $('list').innerHTML = `<div class="center">載入失敗：${esc(x.message)}</div>`;
  }
})();
</script>
</body>
</html>
