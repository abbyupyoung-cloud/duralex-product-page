<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duralex 萬聖節社群圖 Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,700;1,9..144,900&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
.dx-hw {
  --night:      #160E2A;
  --night-2:    #24163F;
  --plum:       #6B2D5C;
  --pumpkin:    #ED6D0F;
  --pumpkin-dk: #C4540A;
  --amber:      #F5B041;
  --slime:      #B6E36B;
  --cream:      #FFF6E5;
  --paper:      #FFFDF7;
  --ink:        #1B1230;
  --muted:      #7A6F8C;
  --line:       #EADFC8;
  --white:      #FFFFFF;

  background: var(--night);
  color: var(--ink);
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 15px;
  line-height: 1.6;
  overflow-x: hidden;
  overflow-x: clip;
  width: 100%;
}
.dx-hw * { box-sizing: border-box; }
.dx-hw p, .dx-hw .why-d, .dx-hw .card-name, .dx-hw .card-qty, .dx-hw .honor-d { text-wrap: pretty; }
/* 中文只在標點、空格處換行，避免把詞拆開 */
.dx-hw p, .dx-hw .why-d, .dx-hw .why-t, .dx-hw .honor-d, .dx-hw .card-qty, .dx-hw .picks-note { word-break: keep-all; overflow-wrap: anywhere; }
.dx-hw h1, .dx-hw h2, .dx-hw .hero-offer { text-wrap: balance; }
.dx-hw h1, .dx-hw h2, .dx-hw h3, .dx-hw h4,
.dx-hw p, .dx-hw span, .dx-hw div, .dx-hw li { margin: 0; padding: 0; }
.dx-hw a { text-decoration: none; }
.dx-hw img { max-width: 100%; }
.dx-hw svg { display: block; }

/* ── Keyframes ── */
@keyframes dxhwFadeUp  { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
@keyframes dxhwMarquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
@keyframes dxhwFloat   { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-16px) rotate(3deg); } }
@keyframes dxhwFlap    { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(.55); } }
@keyframes dxhwFly     { 0% { transform: translate(0,0); } 50% { transform: translate(-26px,-14px); } 100% { transform: translate(0,0); } }
@keyframes dxhwHop     { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-18px); } }
@keyframes dxhwPulse   { 0%,100% { transform: rotate(-10deg) scale(1); } 50% { transform: rotate(-10deg) scale(1.07); } }
@keyframes dxhwTwinkle { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
@keyframes dxhwWink    { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes dxhwBlink   { 0% { opacity: 1; } 100% { opacity: 0; } }
@keyframes dxhwSway    { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }

.dx-hw .reveal { opacity: 0; transform: translateY(28px); transition: opacity .65s ease, transform .65s ease; }
.dx-hw .reveal.visible { opacity: 1; transform: none; }
.dx-hw .d1 { transition-delay: .08s; }
.dx-hw .d2 { transition-delay: .16s; }
.dx-hw .d3 { transition-delay: .24s; }

/* ── Buttons ── */
.dx-hw .btn-pri, .dx-hw .btn-sec {
  display: inline-block; padding: 15px 34px; border-radius: 999px;
  font-size: 14px; font-weight: 700; letter-spacing: .1em;
  transition: transform .2s, background .2s, color .2s, box-shadow .2s, border-color .2s;
}
.dx-hw .btn-pri { background: var(--pumpkin); color: var(--white); box-shadow: 0 6px 0 var(--pumpkin-dk); }
.dx-hw .btn-pri:hover { transform: translateY(3px); box-shadow: 0 3px 0 var(--pumpkin-dk); color: var(--white); }
.dx-hw .btn-sec { border: 1.5px solid rgba(255,255,255,.4); color: var(--white); }
.dx-hw .btn-sec:hover { border-color: var(--amber); color: var(--amber); transform: translateY(-2px); }

/* ══ HERO ══ */
.dx-hw .hero {
  position: relative; min-height: min(86vh, 780px);
  display: grid; grid-template-columns: 46fr 54fr;
  background:
    radial-gradient(ellipse at 78% 30%, rgba(107,45,92,.75) 0%, transparent 55%),
    linear-gradient(180deg, var(--night) 0%, var(--night-2) 100%);
  overflow: hidden;
}
.dx-hw .hero-copy {
  position: relative; z-index: 2;
  display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
  padding: 72px 40px 72px clamp(32px, 11vw, 190px);
}
.dx-hw .hero-eyebrow {
  font-size: 11px; font-weight: 500; letter-spacing: .26em; text-transform: uppercase;
  color: var(--amber); display: flex; align-items: center; gap: 12px; margin-bottom: 22px;
  opacity: 0; animation: dxhwFadeUp .7s ease forwards .1s;
}
.dx-hw .hero-eyebrow::before { content: ''; width: 28px; height: 1px; background: var(--amber); }
.dx-hw .hero-badge {
  background: var(--slime); color: var(--ink);
  font-size: 12px; font-weight: 700; letter-spacing: .12em;
  padding: 6px 16px; border-radius: 999px; margin-bottom: 24px;
  transform: rotate(-2deg);
  opacity: 0; animation: dxhwFadeUp .7s ease forwards .22s;
}
.dx-hw .hero-h1 {
  font-family: 'Fraunces', serif; font-weight: 900; font-style: italic;
  font-size: clamp(46px, 6.4vw, 92px); line-height: .98; color: var(--white);
  margin-bottom: 18px;
  opacity: 0; animation: dxhwFadeUp .7s ease forwards .34s;
}
.dx-hw .hero-h1 em { font-style: italic; color: var(--pumpkin); }
.dx-hw .hero-offer {
  font-size: clamp(24px, 3.2vw, 42px); font-weight: 900; color: var(--white);
  line-height: 1.25; margin-bottom: 10px;
  opacity: 0; animation: dxhwFadeUp .7s ease forwards .46s;
}
.dx-hw .hero-offer b {
  color: var(--ink); background: var(--amber);
  padding: 0 .28em; border-radius: 6px; display: inline-block; transform: rotate(-2deg);
}
.dx-hw .hero-actions {
  display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 36px;
  opacity: 0; animation: dxhwFadeUp .7s ease forwards .66s;
}
.dx-hw .hero-cd { opacity: 0; animation: dxhwFadeUp .7s ease forwards .78s; }

/* Countdown (shared) */
.dx-hw .cd-label {
  font-size: 11px; font-weight: 700; letter-spacing: .22em; color: var(--amber);
  margin-bottom: 10px; display: block;
}
.dx-hw .cd-row { display: flex; gap: 10px; }
.dx-hw .cd-u {
  min-width: 62px; padding: 10px 6px 8px; text-align: center;
  background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); border-radius: 10px;
}
.dx-hw .cd-n {
  font-family: 'Fraunces', serif; font-size: 30px; font-weight: 900;
  color: var(--white); line-height: 1; display: block; font-variant-numeric: tabular-nums;
}
.dx-hw .cd-l { font-size: 10px; font-weight: 700; letter-spacing: .18em; color: rgba(255,255,255,.6); display: block; margin-top: 4px; }
.dx-hw .cd.ended .cd-row { display: none; }

/* Hero visual */
.dx-hw .hero-vis { position: relative; min-height: 560px; }
.dx-hw .moon {
  position: absolute; top: 50%; left: 50%;
  width: min(40vw, 560px); aspect-ratio: 1; border-radius: 50%;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle at 35% 30%, #FFF9E8 0%, #FBE6A8 55%, #F5B041 100%);
  box-shadow: 0 0 120px 30px rgba(245,176,65,.28);
}
.dx-hw .moon::before, .dx-hw .moon::after {
  content: ''; position: absolute; border-radius: 50%; background: rgba(196,84,10,.12);
}
.dx-hw .moon::before { width: 18%; height: 18%; top: 22%; left: 58%; }
.dx-hw .moon::after  { width: 10%; height: 10%; top: 76%; left: 58%; }

/* Picardie 小劇場：所有座標都是月亮的百分比 */
.dx-hw .scene { position: absolute; inset: 0; mix-blend-mode: multiply; clip-path: circle(50% at 50% 50%); }
.dx-hw .stage { position: absolute; inset: 0; }
.dx-hw .scene-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.dx-hw .pc { position: absolute; mix-blend-mode: multiply; }
.dx-hw .pc img { display: block; width: 100%; height: auto;
  -webkit-mask-image: radial-gradient(closest-side, #000 82%, transparent 100%); mask-image: radial-gradient(closest-side, #000 82%, transparent 100%); }
.dx-hw .pc-g { width: 34.7%; left: 33.2%; top: 38.1%; transform: rotate(180deg); }
.dx-hw .pc-a { width: 32.3%; left: 5.7%;  top: 49.4%; transform: rotate(180deg); }
.dx-hw .pc-p { width: 30.8%; left: 62.9%; top: 47%;   transform: rotate(180deg); }
.dx-hw .hat { transform-box: fill-box; transform-origin: 50% 100%; animation: dxhwSway 2.8s ease-in-out infinite; }
.dx-hw .eyes { transform-box: fill-box; transform-origin: center; animation: dxhwWink 4.5s infinite; }
.dx-hw .eyes-b { animation-delay: 1.4s; }
.dx-hw .eyes-c { animation-delay: 2.7s; }
.dx-hw .pumpkin { transform-box: fill-box; transform-origin: 50% 100%; animation: dxhwSway 3.2s ease-in-out infinite; }
.dx-hw .burst {
  position: absolute; top: 12%; right: 9%;
  width: clamp(104px, 13vw, 176px); aspect-ratio: 1;
  background: var(--pumpkin); color: var(--white); border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  animation: dxhwPulse 1.8s ease-in-out infinite;
  box-shadow: 0 0 0 6px rgba(237,109,15,.25), 0 16px 34px rgba(0,0,0,.35);
  text-align: center; line-height: 1;
}
.dx-hw .burst small { font-size: clamp(10px, 1.1vw, 13px); font-weight: 700; letter-spacing: .14em; margin-bottom: 4px; display: block; }
.dx-hw .burst strong { font-family: 'Fraunces', serif; font-size: clamp(38px, 5vw, 68px); font-weight: 900; font-style: italic; display: block; }
.dx-hw .burst strong i { font-family: 'Noto Sans TC', sans-serif; font-style: normal; font-size: .42em; font-weight: 900; margin-left: 2px; }

.dx-hw .bat { position: absolute; color: #0B0616; animation: dxhwFly 5s ease-in-out infinite; }
.dx-hw .bat svg { width: 100%; height: auto; animation: dxhwFlap .45s ease-in-out infinite; transform-origin: center; }
.dx-hw .bat-1 { width: 74px; top: 16%; left: 12%; }
.dx-hw .bat-2 { width: 46px; top: 34%; left: 30%; animation-duration: 6.5s; animation-delay: -2s; }
.dx-hw .bat-3 { width: 56px; top: 9%; left: 52%; animation-duration: 7s; animation-delay: -4s; }
.dx-hw .star {
  position: absolute; width: 4px; height: 4px; border-radius: 50%; background: var(--white);
  animation: dxhwTwinkle 2.6s ease-in-out infinite;
}

@media (max-width: 860px) {
  .dx-hw .hero { grid-template-columns: 1fr; min-height: 0; }
  .dx-hw .hero-vis { order: -1; min-height: 96vw; }
  .dx-hw .moon { width: 84vw; transform: translate(-50%, -50%); }
  .dx-hw .burst { width: 27vw; top: 8%; right: 5%; }
  .dx-hw .burst strong { font-size: 10.5vw; }
  .dx-hw .burst small { font-size: 2.8vw; }
  .dx-hw .hero-copy { padding: 12px 24px 56px; }
  .dx-hw .cd-u { min-width: 0; flex: 1; }
  .dx-hw .cd-row { width: 100%; }
  .dx-hw .hero-cd { width: 100%; }
}

/* ══ MARQUEE ══ */
.dx-hw .marquee-wrap { background: var(--pumpkin); overflow: hidden; padding: 14px 0; position: relative; z-index: 3; }
.dx-hw .marquee-track { display: flex; width: max-content; animation: dxhwMarquee 38s linear infinite; }
.dx-hw .marquee-item {
  display: flex; align-items: center; gap: 14px; padding: 0 22px; white-space: nowrap;
  color: var(--white); font-size: 16px; font-weight: 900; letter-spacing: .08em;
}
.dx-hw .marquee-item svg { width: 26px; height: auto; color: var(--ink); flex-shrink: 0; }
.dx-hw .marquee-item em { font-family: 'Fraunces', serif; font-style: italic; font-weight: 900; color: var(--ink); }

/* ══ WHY DURALEX ══ */
.dx-hw .why { background: var(--cream); padding: 0 56px 100px; position: relative; }
.dx-hw .drip { display: block; height: 56px; color: var(--pumpkin); margin: 0 -56px 56px; width: calc(100% + 112px); max-width: none; }
.dx-hw .sec-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .28em; text-transform: uppercase; color: var(--pumpkin-dk); margin-bottom: 8px; }
.dx-hw .sec-h2 {
  font-family: 'Fraunces', 'Noto Sans TC', serif; font-weight: 900;
  font-size: clamp(28px, 3.8vw, 50px); line-height: 1.15; color: var(--ink);
}
.dx-hw .sec-h2 em { font-style: italic; color: var(--pumpkin); }
.dx-hw .sec-h2 em[lang="fr"] { white-space: nowrap; font-size: .86em; }
.dx-hw .why-inner { max-width: 1160px; margin: 0 auto; }
.dx-hw .why-hd { display: grid; grid-template-columns: 1.15fr 1fr; gap: 48px; align-items: end; margin-bottom: 60px; }
.dx-hw .why-lead { font-size: 15px; line-height: 1.9; color: var(--muted); }
.dx-hw .why-grid { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1.5px solid var(--ink); }
.dx-hw .why-item { padding: 34px 28px 8px 0; }
.dx-hw .why-item + .why-item { padding-left: 28px; border-left: 1px solid var(--line); }
.dx-hw .why-n {
  font-family: 'Fraunces', serif; font-weight: 900; font-style: italic;
  font-size: clamp(44px, 4.6vw, 64px); line-height: 1; color: var(--ink); margin-bottom: 16px;
  letter-spacing: -.02em;
}
.dx-hw .why-n sup { font-size: .42em; color: var(--pumpkin); margin-left: 2px; vertical-align: top; position: relative; top: .3em; }
.dx-hw .why-t { font-size: 16px; font-weight: 900; color: var(--ink); margin-bottom: 8px; }
.dx-hw .why-d { font-size: 13px; line-height: 1.8; color: var(--muted); }
.dx-hw .honor {
  margin-top: 64px; display: grid; grid-template-columns: 340px 1fr;
  border-radius: 22px; overflow: hidden; background: var(--ink); color: var(--white);
  border: 1.5px solid var(--ink);
}
.dx-hw .honor-k { font-size: 11px; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; color: var(--amber); margin-bottom: 14px; }
.dx-hw .honor-award {
  background: var(--white); padding: 30px 30px 28px;
  display: flex; flex-direction: column; justify-content: center;
}
.dx-hw .honor-award .honor-k { color: var(--pumpkin-dk); margin-bottom: 10px; }
.dx-hw .honor-logo { display: block; width: 100%; height: auto; margin-bottom: 14px; }
.dx-hw .honor-d { font-size: 13px; font-weight: 700; color: var(--ink); line-height: 1.6; }
.dx-hw .flag {
  display: inline-block; width: 21px; height: 14px; vertical-align: -2px; margin-right: 7px;
  border-radius: 2px; box-shadow: 0 0 0 1px rgba(0,0,0,.12);
}
.dx-hw .honor-museum { padding: 40px 44px; }
.dx-hw .honor-lead { font-size: 15px; line-height: 1.8; color: rgba(255,255,255,.75); margin-bottom: 22px; max-width: 34em; }
.dx-hw .honor-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; }
.dx-hw .honor-list li { padding: 16px 0; border-top: 1px solid rgba(255,255,255,.12); display: flex; flex-direction: column; gap: 2px; }
.dx-hw .honor-list li:nth-child(odd) { padding-right: 24px; }
.dx-hw .honor-list li:nth-child(even) { padding-left: 24px; border-left: 1px solid rgba(255,255,255,.12); }
.dx-hw .honor-mn { font-family: 'Fraunces', serif; font-style: italic; font-weight: 700; font-size: clamp(20px, 2.1vw, 28px); line-height: 1.15; color: var(--white); }
.dx-hw .honor-ml { font-size: 12px; letter-spacing: .08em; color: rgba(255,255,255,.6); margin-top: 4px; }
@media (max-width: 860px) {
  .dx-hw .why { padding: 0 24px 64px; }
  .dx-hw .drip { margin: 0 -24px 36px; width: calc(100% + 48px); height: 36px; }
  .dx-hw .why-hd { grid-template-columns: 1fr; gap: 16px; margin-bottom: 36px; }
  .dx-hw .why-grid { grid-template-columns: 1fr 1fr; }
  .dx-hw .why-item, .dx-hw .why-item + .why-item { padding: 26px 16px 22px 0; border-left: none; }
  .dx-hw .why-item:nth-child(even) { padding-left: 16px; border-left: 1px solid var(--line); }
  .dx-hw .why-item:nth-child(n+3) { border-top: 1px solid var(--line); }
  .dx-hw .honor { margin-top: 40px; grid-template-columns: 1fr; border-radius: 18px; }
  .dx-hw .honor-award { padding: 24px 24px 22px; }
  .dx-hw .honor-logo { max-width: 320px; }
  .dx-hw .honor-museum { padding: 28px 24px 16px; }
  .dx-hw .honor-list li:nth-child(odd) { padding-right: 12px; }
  .dx-hw .honor-list li:nth-child(even) { padding-left: 12px; }
}

/* ══ PICKS + BASKET ══ */
.dx-hw .picks {
  background: linear-gradient(180deg, var(--night-2) 0%, var(--night) 100%);
  padding: 96px 56px 40px; position: relative;
}
.dx-hw .picks-inner { max-width: 1200px; margin: 0 auto; }
.dx-hw .picks-hd { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 44px; flex-wrap: wrap; }
.dx-hw .picks .sec-eyebrow { color: var(--amber); }
.dx-hw .picks .sec-h2 { color: var(--white); }
.dx-hw .picks-note { font-size: 13px; color: rgba(255,255,255,.65); max-width: 26em; }
.dx-hw .picks-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; }
@media (max-width: 980px) { .dx-hw .picks-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 768px) { .dx-hw .picks { padding: 64px 16px 28px; } .dx-hw .picks-grid { gap: 12px; } }

.dx-hw .card {
  background: var(--paper); border-radius: 16px; overflow: hidden;
  display: flex; flex-direction: column; position: relative;
  border: 2px solid transparent;
  transition: transform .25s, border-color .25s, box-shadow .25s;
}
.dx-hw .card:hover { transform: translateY(-6px) rotate(-.6deg); border-color: var(--pumpkin); box-shadow: 0 18px 40px rgba(0,0,0,.4); }
.dx-hw .card-tag {
  position: absolute; top: 12px; left: 12px; z-index: 2;
  font-size: 11px; font-weight: 900; letter-spacing: .08em;
  padding: 4px 11px; border-radius: 999px; transform: rotate(-4deg);
  background: var(--ink); color: var(--white);
}
.dx-hw .card:nth-child(4n+1) .card-tag { background: var(--pumpkin); }
.dx-hw .card:nth-child(4n+2) .card-tag { background: var(--plum); }
.dx-hw .card:nth-child(4n+3) .card-tag { background: var(--slime); color: var(--ink); }
.dx-hw .card-img { display: block; aspect-ratio: 1; background: var(--white); padding: 16px; overflow: hidden; }
.dx-hw .card-img img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; transition: transform .6s cubic-bezier(.25,.46,.45,.94); }
.dx-hw .card-img.cover { padding: 0; }
.dx-hw .card-img.cover img { object-fit: cover; mix-blend-mode: normal; }
.dx-hw .card:hover .card-img img { transform: scale(1.07); }
.dx-hw .card-info { padding: 14px 16px 16px; flex: 1; display: flex; flex-direction: column; }
.dx-hw .card-series { font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--pumpkin-dk); margin-bottom: 4px; }
.dx-hw .card-name { font-size: 14px; font-weight: 700; color: var(--ink); line-height: 1.35; margin-bottom: 3px; }
.dx-hw .card-qty { font-size: 11px; color: var(--muted); margin-bottom: 10px; flex: 1; }
.dx-hw .card-price { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 700; color: var(--ink); margin-bottom: 12px; }
.dx-hw .card-price small { font-family: 'Noto Sans TC', sans-serif; font-size: 11px; font-weight: 400; color: var(--muted); margin-left: 4px; }
.dx-hw .card-more {
  display: block; text-align: center;
  font-size: 13px; font-weight: 700; letter-spacing: .06em;
  background: var(--ink); color: var(--white);
  border-radius: 999px; padding: 9px 10px;
  transition: background .2s;
}
.dx-hw .card:hover .card-more { background: var(--pumpkin); }
.dx-hw .picks-more { text-align: center; padding: 36px 0 20px; }
.dx-hw .picks-more a {
  color: var(--white); font-size: 13px; font-weight: 700; letter-spacing: .14em;
  border-bottom: 1.5px solid var(--pumpkin); padding-bottom: 3px; transition: color .2s;
}
.dx-hw .picks-more a:hover { color: var(--amber); }

/* 淺色版（餐盤＋沙拉碗） */
.dx-hw .picks.light { background: var(--cream); }
.dx-hw .picks.light .sec-eyebrow { color: var(--pumpkin-dk); }
.dx-hw .picks.light .sec-h2 { color: var(--ink); }
.dx-hw .picks.light .picks-note { color: var(--muted); }
.dx-hw .picks.light .card { border-color: var(--line); }
/* 餐盤與禮盒多為情境照：滿版裁切 */
.dx-hw .picks.light .card-img, .dx-hw .picks.gift .card-img { padding: 0; }
.dx-hw .picks.light .card-img img, .dx-hw .picks.gift .card-img img { object-fit: cover; mix-blend-mode: normal; }
